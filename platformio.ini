; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
; pioarduino: fork de platform-espressif32 con Arduino-ESP32 core 3.x / ESP-IDF 5.x
; Release estable 55.03.312-1 = Arduino 3.3.12 + ESP-IDF 5.5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

lib_deps = 
    adafruit/Adafruit BusIO@^1.14.1 
    paulstoffregen/OneWire@^2.3.6
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.7
	adafruit/Adafruit SPIFlash 
    milesburton/DallasTemperature@^3.9.1
 

build_flags =
    -DARDUINO_USB_MODE=1 
    -DARDUINO_USB_CDC_ON_BOOT=1
 


; Serial Monitor options
monitor_speed = 115200
